services:
  site:
    image: ruby:3.3
    working_dir: /site
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - .:/site
      - jekyll-bundle:/usr/local/bundle
    command: bash -lc "bundle install && bundle exec jekyll serve --host 0.0.0.0 --port 4000 --force_polling"

volumes:
  jekyll-bundle:
    name: jekyll-bundle
